name: Build AirStretch

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
          - os: windows-latest
            name: Windows
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run DSP test
        shell: bash
        run: |
          if [ -f build/Release/EngineTest.exe ]; then build/Release/EngineTest.exe; \
          else build/EngineTest; fi

      - name: Upload plugins
        uses: actions/upload-artifact@v4
        with:
          name: AirStretch-${{ matrix.name }}
          path: |
            build/AirStretch_artefacts/Release/VST3
            build/AirStretch_artefacts/Release/AU
            build/AirStretch_artefacts/Release/Standalone

  # OS X 10.8 Mountain Lion build (JUCE 6.1.6, 64-bit Intel, VST3 + AU), for
  # older hosts such as Pro Tools 11 through a wrapper like Blue Cat PatchWork.
  # Apple's current tools only officially target macOS 10.13+, so this uses the
  # oldest Xcode on the runner and then checks the binaries for 10.8 compatibility.
  mac-legacy:
    name: macOS 10.8 legacy
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Select the oldest installed Xcode
        run: |
          for x in /Applications/Xcode_16.app /Applications/Xcode_16.0.app /Applications/Xcode_16.1.app /Applications/Xcode_16.2.app; do
            if [ -d "$x" ]; then sudo xcode-select -s "$x"; break; fi
          done
          xcodebuild -version
          echo "SDK: $(xcrun --show-sdk-version)"

      - name: Configure
        run: >
          cmake -S . -B build-legacy -DCMAKE_BUILD_TYPE=Release
          -DAIRSTRETCH_LEGACY_MAC=ON -DAIRSTRETCH_BUILD_TESTS=OFF
          -DCMAKE_CXX_FLAGS="-Wunguarded-availability"

      - name: Build
        run: |
          set -o pipefail
          cmake --build build-legacy --config Release --parallel 2>&1 | tee build-legacy/build.log

      - name: Check binaries for OS X 10.8 compatibility
        run: scripts/check-legacy-mac.sh build-legacy/AirStretch_artefacts/Release build-legacy/build.log

      - name: Package (ditto keeps the bundles intact)
        run: |
          PKG=dist/AirStretch-macOS-10.8
          mkdir -p "$PKG/VST3" "$PKG/AU"
          ditto build-legacy/AirStretch_artefacts/Release/VST3/AirStretch.vst3 "$PKG/VST3/AirStretch.vst3"
          ditto build-legacy/AirStretch_artefacts/Release/AU/AirStretch.component "$PKG/AU/AirStretch.component"
          cat > "$PKG/INSTALL.txt" <<'TXT'
          AirStretch for OS X 10.8 Mountain Lion (64-bit Intel)

          The VST3 and AU are "bundles": folders that Finder may show as folders
          on older systems. Copy each whole item, not just what is inside it.

            VST3/AirStretch.vst3       ->  /Library/Audio/Plug-Ins/VST3/
            AU/AirStretch.component    ->  /Library/Audio/Plug-Ins/Components/

          Then rescan plugins in your host (e.g. Blue Cat PatchWork).

          If the plugin is not listed after a rescan, run this in Terminal and rescan:
            sudo xattr -dr com.apple.quarantine /Library/Audio/Plug-Ins/VST3/AirStretch.vst3 /Library/Audio/Plug-Ins/Components/AirStretch.component
          TXT
          sed -i '' 's/^          //' "$PKG/INSTALL.txt"
          ditto -c -k --keepParent "$PKG" dist/AirStretch-macOS-10.8.zip
          echo "Contents of AirStretch-macOS-10.8.zip:"
          unzip -l dist/AirStretch-macOS-10.8.zip

      - name: Upload plugins
        uses: actions/upload-artifact@v4
        with:
          name: AirStretch-macOS-10.8-legacy
          path: dist/AirStretch-macOS-10.8.zip

      # A release gives a direct download link (no artifact zip around the zip)
      - name: Publish as the "mac-10.8-latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete mac-10.8-latest --yes --cleanup-tag || true
          gh release create mac-10.8-latest dist/AirStretch-macOS-10.8.zip \
            --title "AirStretch for OS X 10.8 (latest build)" \
            --notes "VST3 and AU for OS X 10.8 Mountain Lion, 64-bit Intel. Built from ${GITHUB_SHA::7}. See INSTALL.txt inside the zip." \
            --target "$GITHUB_SHA"
